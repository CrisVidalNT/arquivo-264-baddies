name: Verificar Arquivo 264

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar pontuação
        run: npm test
      - name: Validar qualidade
        run: npm run lint
      - name: Compilar aplicação
        run: npm run build
